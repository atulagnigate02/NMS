services:
  postgres:
    image: postgres:16
    container_name: nms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nms_product
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nms_product"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nms_postgres_data:
